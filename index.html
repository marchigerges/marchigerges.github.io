<head>
  <meta charset="UTF-8" />

  <style>
    /* Fonts are self-hosted in /fonts (Geist + Geist Mono, from the Vercel Geist
       repo, OFL licensed) so this page renders identically with no CDN dependency. */
    @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.ttf") format("truetype-variations"); font-weight: 100 900; font-style: normal; font-display: swap; }
    @font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Variable.ttf") format("truetype-variations"); font-weight: 100 900; font-style: normal; font-display: swap; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F8F8; --surface: #F0F1F2; --ink: #111213; --ink-2: #5B5F63; --ink-3: #9AA0A4;
      --accent: #2547D0; --border: rgba(17,18,19,0.10); --border-strong: rgba(17,18,19,0.16);
      --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --max: 1120px; --radius-sm: 8px;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
      --dur-1: 150ms; --dur-2: 240ms; --dur-3: 600ms;
    }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--accent); color: #fff; }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; padding: 22px 40px; }
    .nav-logo { font-family: var(--sans); font-weight: 600; font-size: 16px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
    @media (max-width: 640px) { nav { padding: 16px 20px; } }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .hero { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 140px 40px 80px; max-width: var(--max); margin: 0 auto; }
    .hero-intro-row { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; opacity: 0; animation: fadeUp var(--dur-3) var(--ease) forwards 0.1s; }
    .hero-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: center top; border: 1px solid var(--border-strong); flex-shrink: 0; }
    .hero-label { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 12px; }
    .hero-label::before { content: ""; display: block; width: 24px; height: 1px; background: var(--ink-3); }
    .hero-headline { font-family: var(--sans); font-weight: 600; font-size: clamp(34px, 5.8vw, 96px); line-height: 1.02; letter-spacing: -0.02em; max-width: 1020px; text-wrap: balance; margin-bottom: 32px; color: var(--ink); opacity: 0; animation: fadeUp var(--dur-3) var(--ease) forwards 0.22s; }
    .hero-headline .warm { color: var(--accent); font-style: normal; }
    .hero-sub { font-size: 17px; color: var(--ink-2); font-weight: 400; max-width: 520px; line-height: 1.6; margin-bottom: 44px; opacity: 0; animation: fadeUp var(--dur-3) var(--ease) forwards 0.36s; }
    .hero-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; opacity: 0; animation: fadeUp var(--dur-3) var(--ease) forwards 0.5s; }

    .hero-media { display: block; width: 100%; height: 46vh; min-height: 280px; overflow: hidden; opacity: 0; animation: fadeIn var(--dur-3) var(--ease) forwards 0.15s;
      -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 82%);
      mask-image: linear-gradient(to bottom, black 50%, transparent 82%);
    }
    .hero-media img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; filter: grayscale(1) contrast(1.05); display: block; }
    .hero-intro-row .hero-photo { display: none; }
    @media (max-width: 899px) {
      .hero { min-height: 0; justify-content: flex-start; padding: 0 24px 64px; }
      .hero-intro-row { margin-top: -36px; }
    }
    @media (min-width: 900px) {
      .hero-media {
        position: absolute; top: 0; right: 0; bottom: 0; z-index: 2;
        width: clamp(300px, 38vw, 560px); height: auto; min-height: 0;
        pointer-events: none;
        -webkit-mask-image: linear-gradient(to right, transparent, black 30%);
        mask-image: linear-gradient(to right, transparent, black 30%);
      }
      .hero-headline { max-width: 560px; }
    }

    .btn-primary { will-change: transform; display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); text-decoration: none; font-size: 14px; font-weight: 500; padding: 13px 22px; border-radius: var(--radius-sm); transition: background-color var(--dur-1) var(--ease), transform var(--dur-2) var(--ease); }
    .btn-primary:hover { background: #2a2b2d; }
    .btn-primary:active { transform: scale(0.97); }

    .skel { background-image: linear-gradient(100deg, var(--surface) 20%, var(--border-strong) 45%, var(--surface) 70%); background-size: 200% 100%; animation: skeleton-sheen 1.6s ease-in-out infinite; }
    .skel.is-loaded { background-image: none; animation: none; }
    @keyframes skeleton-sheen { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (prefers-reduced-motion: reduce) {
      .hero-intro-row, .hero-headline, .hero-sub, .hero-actions, .hero-media { animation: none; opacity: 1; }
      .skel:not(.is-loaded) { animation: none; background-image: none; background-color: var(--surface); }
    }
  </style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">Marchilino</a>
</nav>

<div style="position:relative;">
  <div class="hero-media"><img src="Profile%20Pic.jpg" alt="" class="skel" /></div>
  <div class="hero">
    <div class="hero-intro-row">
      <img src="Profile%20Pic.jpg" alt="Marchilino" class="hero-photo" />
      <p class="hero-label">Sydney, Australia</p>
    </div>
    <h1 class="hero-headline"><span class="warm">Customer Solutions</span> Specialist</h1>
    <p class="hero-sub">Currently working as a Customer Solutions Specialist at Reckon. Keeping this page simple whilst I continue to grow professionally.</p>
    <div class="hero-actions">
      <a href="https://linkedin.com/in/marchilino" target="_blank" class="btn-primary">Connect with me &#8599;</a>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll("img.skel").forEach(function(img) {
    function reveal() { img.classList.add("is-loaded"); }
    if (img.complete && img.naturalWidth > 0) { reveal(); }
    else {
      img.addEventListener("load", reveal);
      img.addEventListener("error", reveal);
    }
  });

  var prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (window.matchMedia("(hover: hover) and (pointer: fine)").matches && !prefersReducedMotion.matches) {
    document.querySelectorAll(".btn-primary").forEach(function(btn) {
      var strength = 0.25;
      var maxPull = 6;
      btn.addEventListener("mousemove", function(e) {
        var r = btn.getBoundingClientRect();
        var x = (e.clientX - (r.left + r.width / 2)) * strength;
        var y = (e.clientY - (r.top + r.height / 2)) * strength;
        x = Math.max(-maxPull, Math.min(maxPull, x));
        y = Math.max(-maxPull, Math.min(maxPull, y));
        btn.style.transform = "translate(" + x + "px, " + y + "px)";
      });
      btn.addEventListener("mouseleave", function() { btn.style.transform = ""; });
    });
  }
</script>

</body>
</html>
